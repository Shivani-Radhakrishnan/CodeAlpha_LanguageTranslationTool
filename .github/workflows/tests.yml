name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt -r requirements-speech.txt
      - name: Check dependency consistency
        run: pip check
      # All network calls are mocked; tests/conftest.py blocks sockets.
      - name: Run tests
        run: pytest
      - name: Recompute the speech evaluation from the recorded outputs
        run: python -m eval.speech_eval
